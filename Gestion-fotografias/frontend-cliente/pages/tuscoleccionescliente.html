<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Colecciones</title>
    <link rel="stylesheet" href="../css/panelcliente.css">
</head>
<body>

    <div class="Contenedor">

        <div class="Sidebar">

            <div class="Logo">
                <p>Galería del Cliente</p>
            </div>

            <Div class="Menu">
                <a class="ItemMenu" href="panelcliente.html">
                    <p>Colecciones Públicas</p>
                </a>

                <a class="ItemMenuActivo" href="tuscoleccionescliente.html">
                    <p>Tus Colecciones</p>
                </a>

                <a class="ItemMenu" href="favoritoscliente.html">
                    <p>Favoritos</p>
                </a>
            </Div>

            <hr>

            <div class="PieSidebar">
                <button class="BotonCerrarSesion CerrarSesionCliente" type="button">Cerrar sesión</button>
            </div>

        </div>

        <div class="Principal">

            <div class="Encabezado">
                <h1>Tus Colecciones</h1>
            </div>

            <div class="ZonaInvitacion" id="zonaInvitacion" hidden>

                <div class="TarjetaInvitacion">
                    <p class="EtiquetaInvitacion">Invitación recibida</p>
                    <h2 id="tituloInvitacion"></h2>
                    <p id="estadoInvitacion" class="DatosColeccion"></p>
                    <div class="AccionesInvitacion" id="accionesInvitacion"></div>
                </div>

            </div>

            <h2 class="SubtituloPagina">Colecciones con acceso</h2>

            <p id="mensajeCarga" class="EstadoCarga">Cargando tus colecciones...</p>
            <p id="mensajeError" class="EstadoError" hidden></p>

            <div class="GaleriaColecciones" id="galeriaColecciones"></div>

            <div class="Sincolecciones" id="sinColecciones">
                <p>No tienes colecciones aún.</p>
            </div>

        </div>
    </div>

    <div class="ContenedorToasts" id="toasts"></div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/tuscoleccionescliente.js"></script>
</body>
</html>
