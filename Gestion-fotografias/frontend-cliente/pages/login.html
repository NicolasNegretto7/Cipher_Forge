<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Iniciar sesión de cliente</title>
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/estilos.css" />
    </head>
    <body>
        <header>
            <h1>Iniciar sesión de cliente</h1>
            <p>Accede a tus colecciones</p>
        </header>

        <main class="container">
            <section class="card">
                <h2>Ingresa tus datos</h2>
                <form id="formLogin">
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="tugmail@gmail.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="contraseña">Contraseña</label>

                        <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            placeholder="******"
                            autocomplete="current-password"
                            required
                        />
                    </div>

                    <div class="texto-centrado margen-arriba">
                        <button type="submit" class="btn btn-principal">Ingresar</button>
                    </div>
                </form>

                <p id="mensajeLogin" class="mensaje-perfil" role="status"></p>

                <p class="texto-centrado margen-arriba">
                    ¿No tienes cuenta?
                    <a id="enlaceRegistro" href="registro.html">Registrate aquí.</a>
                </p>
            </section>
        </main>

        <footer>
            <p>Políticas de Privacidad.</p>
        </footer>
        <script type="module" src="../dom/auth/login.js"></script>
    </body>
</html>
