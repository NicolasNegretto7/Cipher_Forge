<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Colección</title>
    <link rel="stylesheet" href="../css/panelcliente.css">
</head>
<body>

    <div class="Contenedor">

        <div class="Sidebar">

            <div class="Logo">
                <p>Galería del Cliente</p>
            </div>

            <Div class="Menu">
                <a class="ItemMenu" href="panelcliente.html">
                    <p>Colecciones Públicas</p>
                </a>

                <a class="ItemMenu" href="tuscoleccionescliente.html">
                    <p>Tus Colecciones</p>
                </a>

                <a class="ItemMenu" href="favoritoscliente.html">
                    <p>Favoritos</p>
                </a>
            </Div>

            <hr>

            <div class="PieSidebar">
                <button class="BotonCerrarSesion CerrarSesionCliente" type="button">Cerrar sesión</button>
            </div>

        </div>

        <div class="Principal">

            <div class="Encabezado">
                <a class="EnlaceVolver" href="panelcliente.html">&larr; Volver</a>
                <h1 id="tituloColeccion">Colección</h1>
            </div>

            <div id="infoColeccion" class="InfoColeccion"></div>

            <p id="mensajeCarga" class="EstadoCarga">Cargando colección...</p>
            <p id="mensajeError" class="EstadoError" hidden></p>

            <div class="GaleriaMedia" id="galeria"></div>

            <div class="EstadoVacio" id="estadoVacio" hidden>
                <p>Esta colección aún no tiene archivos.</p>
            </div>

        </div>
    </div>

    <div class="Visor" id="visor">
        <div class="VisorInterior">
            <button class="BotonCerrarVisor" id="cerrarVisor">✕</button>
            <button class="FlechaVisor Izquierda" id="anteriorVisor" type="button">&#10094;</button>
            <div id="visorContenido"></div>
            <div class="AccionesVisor" id="accionesVisor"></div>
            <button class="FlechaVisor Derecha" id="siguienteVisor" type="button">&#10095;</button>
        </div>
    </div>

    <div class="ContenedorToasts" id="toasts"></div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/gallery.js"></script>
</body>
</html>
