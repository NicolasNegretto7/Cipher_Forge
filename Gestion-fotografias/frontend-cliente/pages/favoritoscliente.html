<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Favoritos</title>
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/panelcliente.css" />
    </head>
    <body>
        <div class="Contenedor">
            <div class="Sidebar">
                <div class="Logo">
                    <p>Galería del Cliente</p>
                </div>

                <div class="Menu">
                    <a class="ItemMenu" href="panelcliente.html">
                        <p>Colecciones Públicas</p>
                    </a>

                    <a class="ItemMenu" href="tuscoleccionescliente.html">
                        <p>Tus Colecciones</p>
                    </a>

                    <a class="ItemMenuActivo" href="favoritoscliente.html">
                        <p>Favoritos</p>
                    </a>
                </div>

                <hr />

                <div class="PieSidebar">
                    <button class="BotonCerrarSesion CerrarSesionCliente" type="button">
                        Cerrar sesión
                    </button>
                </div>
            </div>

            <main class="Principal">
                <div class="Encabezado">
                    <h1>Favoritos</h1>
                </div>

                <p id="mensajeCarga" class="EstadoCarga">Cargando tus favoritos...</p>
                <p id="mensajeError" class="EstadoError" hidden></p>

                <div class="GaleriaMedia" id="galeriaFavoritos"></div>

                <div class="Sinfavoritos" id="sinFavoritos">
                    <p>No tienes favoritos aún.</p>
                </div>
            </main>
        </div>

        <div class="ContenedorToasts" id="toasts"></div>
        <script type="module" src="../dom/favoritos/favoritoscliente.js"></script>
    </body>
</html>
