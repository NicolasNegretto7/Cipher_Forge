; Cipher Forge - Configuración de PHP para el contenedor (Apache/mod_php).
; Alinea los límites del runtime con los que ya valida la aplicación:
;   - MultimediaValidator: imagen hasta 20 MB, video hasta 800 MB (CF-03/RF7).
; Sin estos valores, el take 'upload_max_filesize=2M' por defecto de php:8.2-apache
; rechazaba cualquier archivo >2 MB en PHP antes de llegar al código (CF-NUEVO).

file_uploads = On

; Tope por archivo: permite el video de 800 MB con margen.
upload_max_filesize = 900M

; Tope del cuerpo total de la petición multipart (varias fotos en una misma subida).
post_max_size = 1G

; Memoria suficiente para procesamiento con GD (imágenes) y transcodificación de video.
memory_limit = 512M

; Tiempo máximo de ejecución y de entrada para subidas grandes (videos de 800 MB).
max_execution_time = 600
max_input_time = 600