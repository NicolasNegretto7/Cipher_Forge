# Toma la imagen definida en el Dockerfile y la imagen oficial de mysql:8.0, y las pone a ejecutar juntas como contenedores. Define en qué puertos escuchan (8080 y 3306), cómo se comunican entre sí por red interna (DB_HOST=db) y qué carpetas de tu disco local se montan en vivo.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cipher-forge:dev
    container_name: cipher_forge_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads
    environment:
      - DB_HOST=db
      - DB_NAME=cipher_forge
      - DB_USER=cipher_user
      - DB_PASS=cipher_password
      - DB_PORT=3306
      - FRONTEND_URL=http://127.0.0.1:5500/Gestion-fotografias
      # Buzón SMTP de desarrollo (CF-02): la app envía el código de verificación por correo
      # a "mailpit" y la bandeja se consulta en http://localhost:8025. Gmail/proveedores
      # externos quedan excluidos del alcance (ver EMAIL_CONFIG.md).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=no-reply@cipherforge.local
      - MAIL_FROM_NAME=Cipher Forge
      # Opcional (H02): endurecer los endpoints /sistema/* a CIDRs concretos.
      # Por defecto solo admite tráfico local/privado (ver SISTEMA_LOCAL.md).
      # - SISTEMA_ALLOWED_IPS=10.0.0.0/8,192.168.0.0/16
    depends_on:
      - db
      - mailpit

  # Worker de mantenimiento (CF-12): ejecuta cron-backup.php --loop en la misma imagen.
  # Automatiza el respaldo diario (HU13) y la purga de colaborativos no aprobados > 24h (HU12)
  # sin depender del host ni de tráfico web. Intervalos configurables por entorno.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cipher-forge:dev
    container_name: cipher_forge_worker
    restart: unless-stopped
    command: php cron-backup.php --loop
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads
    environment:
      - DB_HOST=db
      - DB_NAME=cipher_forge
      - DB_USER=cipher_user
      - DB_PASS=cipher_password
      - DB_PORT=3306
      - BACKUP_INTERVAL_SEG=86400
      - PURGE_INTERVAL_SEG=3600
    depends_on:
      - db

  # Buzón de correo de desarrollo (CF-02 / RF18): recibe los correos generados por la app,
  # los guarda y los expone en una interfaz web. Nada sale de tu máquina.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cipher_forge_mail
    restart: always
    ports:
      - "8025:8025"   # Interfaz web para leer los correos
      - "1025:1025"   # SMTP de entrada usado por la app

  db:
    image: mysql:8.0
    container_name: cipher_forge_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cipher_forge
      MYSQL_USER: cipher_user
      MYSQL_PASSWORD: cipher_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
  uploads_data:
