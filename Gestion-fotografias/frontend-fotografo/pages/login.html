<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cipher Photo para fotógrafos</title>
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/estilos.css?v=eye1" />
    </head>
    <body class="AuthPixie">
        <header class="AuthBarra">
            <a class="AuthMarca" href="../../lading-page/paginaprincipal.html">CipherPhotos</a>
            <a
                class="AuthCerrar"
                href="../../lading-page/paginaprincipal.html"
                aria-label="Cerrar"
                title="Cerrar"
            >
                ✕
            </a>
        </header>

        <main class="AuthCentro">
            <div class="AuthPanelFormulario">
                <section class="AuthCaja">
                    <h1>Iniciar sesión</h1>
                    <p class="AuthSubtitulo">Entra a tu espacio de trabajo como fotógrafo</p>

                    <h2>Completa tus datos</h2>
                    <form id="formLogin">
                        <div class="form-group">
                            <label for="correo">Correo electrónico</label>
                            <input
                                id="correo"
                                name="correo"
                                type="email"
                                placeholder="nombre@correo.com"
                                autocomplete="email"
                                title="Usa un correo válido"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="contraseña">Contraseña</label>
                            <div class="CampoContrasena" style="position: relative">
                                <input
                                    id="contraseña"
                                    name="contraseña"
                                    type="password"
                                    placeholder="Tu contraseña"
                                    autocomplete="current-password"
                                    required
                                />
                                <i
                                    class="BotonOjo"
                                    data-ojo
                                    role="button"
                                    tabindex="0"
                                    aria-label="Mostrar contraseña"
                                    aria-pressed="false"
                                    title="Mostrar contraseña"
                                    style="position: absolute; top: 50%; right: 12px; transform: translateY(-50%); display: inline-flex; color: var(--gris-texto); cursor: pointer"
                                >
                                    <svg
                                        class="IconoOjo IconoVer"
                                        viewBox="0 0 24 24"
                                        width="20"
                                        height="20"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                                        />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                    <svg
                                        class="IconoOjo IconoOcultar"
                                        viewBox="0 0 24 24"
                                        width="20"
                                        height="20"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        aria-hidden="true"
                                        style="display: none"
                                    >
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                                        <path
                                            d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"
                                        />
                                        <path
                                            d="M6.61 6.61A13.5 13.5 0 0 0 1 12s4 7 11 7a10.4 10.4 0 0 0 5.39-1.39"
                                        />
                                        <line x1="2" y1="2" x2="22" y2="22" />
                                    </svg>
                                </i>
                            </div>
                        </div>

                        <div class="margen-arriba">
                            <button type="submit" class="btn btn-principal">Ingresar</button>
                        </div>
                    </form>

                    <p id="mensajeLogin" class="mensaje-perfil" role="status"></p>

                    <p class="AuthEnlace">
                        ¿Todavía no tienes cuenta?
                        <a id="enlaceRegistro" href="registro.html">Crear cuenta</a>
                    </p>
                </section>
            </div>

            <aside class="AuthPanelImagen">
                <img
                    src="../../lading-page/Video%20y%20Imagenes/FotoFotografoDemostrativa.PNG"
                    alt="Vista previa del espacio de trabajo para fotógrafos"
                />
            </aside>
        </main>
        <script type="module" src="../dom/auth/login.js"></script>
    </body>
</html>
