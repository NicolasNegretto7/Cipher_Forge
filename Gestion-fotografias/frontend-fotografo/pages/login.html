<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Iniciar Sesión</h1>
        <p>Accede a tu panel de fotógrafo o cliente</p>
    
      </header>

    <main class="container">
    <section class="card">
    <h2>Ingresa tus datos</h2>
    <form id="formLogin" action="" method="">
    
           <div class="form-group">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" placeholder="tugmail@gmail.com" required>
                

       </div>

    <div class="form-group">
          <label for="contrasena">Contraseña</label>
    
              <input type="password" id="contraseña" name="contraseña" placeholder="******" required>
                
    

                <Div class="texto-centrado margen-arriba">
                <button type="submit" class="btn btn-principal">Ingresar</button>
                </Div>
           
                 </form>

         <P class="texto-centrado margen-arriba">
            ¿No tienes cuenta? <a href="registro.html">Registrate aquí.</a>
        </P>
        </section>
    </main>

    
    <footer>
    <p>Políticas de Privacidad.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
