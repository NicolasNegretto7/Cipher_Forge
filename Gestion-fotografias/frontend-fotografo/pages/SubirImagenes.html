<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Imágenes</title>
    <link rel="stylesheet" href="../css/tuscolecciones.css">
</head>
<body>

    <div class="Contenedor">
        <div class="Sidebar">

            <div class="DatosNuevaColeccion">
                <h2 id="nombreColeccion">Nombre de la colección</h2>
                <p id="descripcionColeccionTexto"></p>
                <p id="estadoVisibilidad"></p>
            </div>

            <hr>

            <div class="Almacenamiento">
                <div class="CirculoAlmacenamiento"></div>
                <p>0 GB de 3 GB usados</p>
                <div class="BotonMas">+</div>
            </div>
        </div>

        <div class="Principal">

            <div class="Encabezado">
                <h1>Subir Imágenes</h1>

                <div class="TagsColeccion">
                    <input id="tagInput" type="text" placeholder="Escribe un tag">
                    <div class="ListaTags" id="listaTags"></div>
                </div>

                <div class="ControlPublicar">
                    <button class="BotonPublicar" id="botonPublicar" type="button" aria-expanded="false" aria-controls="menuVisibilidad">
                        Publicar <span class="FlechaPublicar" aria-hidden="true">▾</span>
                    </button>
                    <div class="MenuVisibilidad" id="menuVisibilidad" hidden>
                        <button type="button" data-visibilidad="privada">
                            <strong>Privada</strong>
                            <span>No aparece en colecciones públicas</span>
                        </button>
                        <button type="button" data-visibilidad="publica">
                            <strong>Pública</strong>
                            <span>Aparece en colecciones públicas</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="ZonaCarga" id="zonaCarga">

                <P><strong>Haz clic para seleccionar tus imagenes</strong></P>

                <p class="Formatos">Formatos permitidos: JPG y MP4</p>
            </div>
            <input type="file" id="selectorArchivos" accept=".jpg,.jpeg,.mp4,image/jpeg,video/mp4" multiple hidden>

            <div class="GaleriaMedia" id="galeria">
                <div class="EstadoVacio" id="estadoVacio">
                    <P>Aún no hay archivos subidos.<br>Sube tu primer JPG o MP4 para comenzar. <br> Tu coleccion sera privada hasta que la publiques.</P>
                </div>
            </div>

        </div>
    </div>

    <div class="Visor" id="visor">
        <div class="VisorInterior">
            <button class="BotonCerrarVisor" id="cerrarVisor">✕</button>
            <div id="visorContenido"></div>
        </div>
    </div>

    <div class="ContenedorToasts" id="toasts"></div>

    <div class="BarraAcciones" id="barraAcciones">
        <button id="agregarFavoritos" type="button">&#10084; Agregar a favoritos</button>
        <button id="eliminarSeleccionados" type="button">&#128465; Eliminar</button>
    </div>

    <script src="../js/subirimagenes.js"></script>
</body>
</html>
