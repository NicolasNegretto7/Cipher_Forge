<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Subir Imágenes</title>
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/subirimagenes.css" />
    </head>
    <body>
        <div class="Contenedor">
            <div class="Sidebar">
                <a class="EnlaceVolver" href="panel.html">← Mis colecciones</a>
                <div class="DatosNuevaColeccion">
                    <h2
                        id="nombreColeccion"
                        class="CampoEditable"
                        contenteditable="true"
                        role="textbox"
                        aria-label="Título de la colección"
                        data-placeholder="Sin título"
                    >
                        Nombre de la colección
                    </h2>
                    <p
                        id="descripcionColeccionTexto"
                        class="CampoEditable"
                        contenteditable="true"
                        role="textbox"
                        aria-label="Descripción de la colección"
                        data-placeholder="Sin descripción"
                    ></p>
                </div>

                <hr />

                <div class="Almacenamiento">
                    <p class="TextoAlmacenamiento">0 KB de 3 GB usados</p>
                </div>
            </div>

            <main class="Principal">
                <div class="Encabezado">
                    <h1>Subir Imágenes</h1>

                    <div class="TagsColeccion" id="zonaTags">
                        <label class="VisualmenteOculto" for="tagInput">Añadir etiqueta</label>
                        <input
                            id="tagInput"
                            type="text"
                            placeholder="Escribe un tag"
                            list="sugerenciasHashtags"
                        />
                        <datalist id="sugerenciasHashtags"></datalist>
                        <div class="ListaTags" id="listaTags" hidden></div>
                    </div>

                    <div class="ControlesQrColaborativo">
                        <button
                            class="BotonGenerarQr BotonMasOpciones"
                            id="botonMasOpciones"
                            type="button"
                            aria-expanded="false"
                            aria-controls="menuMasOpciones"
                            title="Más opciones de la colección"
                        >
                            Más
                            <span class="FlechaMas" aria-hidden="true">▾</span>
                        </button>
                        <div class="MenuMasOpciones" id="menuMasOpciones" hidden>
                            <a
                                class="OpcionMas"
                                id="botonModerarColaborativo"
                                href="#"
                                title="Revisar y aprobar los archivos que subieron los invitados"
                            >
                                Moderar aportes
                            </a>
                            <button
                                class="OpcionMas"
                                id="botonQrColaborativo"
                                type="button"
                                title="QR temporal (24 h) para que los invitados suban fotos y videos al evento"
                            >
                                QR colaborativo
                            </button>
                            <button
                                class="OpcionMas"
                                id="botonQrAcceso"
                                type="button"
                                title="QR/enlace permanente (sin caducidad) para que los clientes accedan y descarguen la colección"
                            >
                                QR de acceso
                            </button>
                        </div>
                    </div>

                    <div class="ControlPublicar">
                        <span class="EstadoVisibilidad" id="estadoVisibilidad" hidden></span>
                        <button
                            class="BotonPublicar"
                            id="botonPublicar"
                            disabled
                            type="button"
                            aria-expanded="false"
                            aria-controls="menuVisibilidad"
                        >
                            Visibilidad
                            <span class="FlechaPublicar" aria-hidden="true">▾</span>
                        </button>
                        <div class="MenuVisibilidad" id="menuVisibilidad" hidden>
                            <button type="button" data-visibilidad="privada">
                                <strong>Privada</strong>
                                <span>No aparece en colecciones públicas</span>
                            </button>
                            <button type="button" data-visibilidad="publica">
                                <strong>Pública</strong>
                                <span>Aparece en colecciones públicas</span>
                            </button>
                        </div>
                    </div>
                </div>

                <label class="ZonaCarga" for="selectorArchivos" id="zonaCarga">
                    <strong>Seleccionar archivos para subir</strong>
                    <span class="Formatos">
                        Formatos permitidos: JPG y MP4.
                    </span>
                </label>
                <input
                    type="file"
                    id="selectorArchivos"
                    disabled
                    accept=".jpg,.jpeg,.mp4,image/jpeg,video/mp4"
                    multiple
                    hidden
                />

                <output class="EstadoVacio" id="estadoVacio">Cargando colección...</output>
                <div class="GaleriaMedia" id="galeria">
                    <button
                        type="button"
                        class="TarjetaAgregar"
                        id="agregarArchivos"
                        aria-label="Agregar más archivos"
                        hidden
                    >
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
            </main>
        </div>

        <div class="Visor" id="visor">
            <div class="VisorInterior">
                <button class="BotonCerrarVisor" id="cerrarVisor">✕</button>
                <div id="visorContenido"></div>
            </div>
        </div>

        <div class="ModalQr" id="modalQrColaborativo" hidden>
            <dialog
                class="ModalQrContenido"
                aria-labelledby="tituloQrColaborativo"
            >
                <button
                    class="BotonCerrarQr"
                    id="cerrarQrColaborativo"
                    type="button"
                    aria-label="Cerrar"
                >
                    ✕
                </button>
                <h2 id="tituloQrColaborativo">QR colaborativo de evento</h2>
                <p class="AvisoExpiracionQr" id="avisoExpiracionQr"></p>
                <div class="ImagenQr" id="imagenQrColaborativo"></div>
                <label for="enlaceQrColaborativo">Enlace de subida para invitados</label>
                <input id="enlaceQrColaborativo" type="text" readonly />
                <div class="AccionesQr">
                    <button class="BotonQr" id="copiarEnlaceColaborativo" type="button">
                        Copiar enlace
                    </button>
                    <a
                        class="BotonQr BotonQrSecundario"
                        id="abrirEnlaceColaborativo"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Abrir
                    </a>
                    <button class="BotonQr" id="imprimirQrColaborativo" type="button">
                        Imprimir hoja
                    </button>
                </dialog>
            </div>
        </div>

        <div class="ModalQr" id="modalQrAcceso" hidden>
            <dialog
                class="ModalQrContenido"
                aria-labelledby="tituloQrAcceso"
            >
                <button class="BotonCerrarQr" id="cerrarQrAcceso" type="button" aria-label="Cerrar">
                    ✕
                </button>
                <h2 id="tituloQrAcceso">QR de acceso permanente</h2>
                <p class="AvisoExpiracionQr" id="avisoQrAcceso"></p>
                <div class="ImagenQr" id="imagenQrAcceso"></div>
                <label for="enlaceQrAcceso">Enlace de acceso para clientes</label>
                <input id="enlaceQrAcceso" type="text" readonly />
                <div class="AccionesQr">
                    <button class="BotonQr" id="copiarEnlaceAcceso" type="button">
                        Copiar enlace
                    </button>
                    <a
                        class="BotonQr BotonQrSecundario"
                        id="abrirEnlaceAcceso"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Abrir
                    </a>
                </div>
            </dialog>
        </div>

        <div class="ModalConfirmacion" id="modalConfirmacion" hidden>
            <div
                class="ConfirmacionContenido"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="textoConfirmacion"
            >
                <p id="textoConfirmacion"></p>
                <div class="AccionesConfirmacion">
                    <button
                        class="BotonCancelarConfirmacion"
                        id="confirmacionCancelar"
                        type="button"
                    >
                        Cancelar
                    </button>
                    <button
                        class="BotonAceptarConfirmacion"
                        id="confirmacionAceptar"
                        type="button"
                    >
                        Aceptar
                    </button>
                </div>
            </div>
        </div>

        <div class="ContenedorToasts" id="toasts"></div>

        <div class="BarraAcciones" id="barraAcciones">
            <button id="seleccionarTodas" type="button">
                &#9745; Seleccionar todas las imágenes
            </button>
            <button id="eliminarSeleccionados" type="button">&#128465; Eliminar</button>
        </div>
        <script type="module" src="../dom/colecciones/subirimagenes.js"></script>
    </body>
</html>
