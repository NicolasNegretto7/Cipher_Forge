<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verificar Correo</title>
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/estilos.css?v=split6" />
    </head>
    <body class="AuthPixie AuthVerificacion">
        <header class="AuthBarra">
            <a class="AuthMarca" href="../../lading-page/paginaprincipal.html">CipherPhotos</a>
            <a
                class="AuthCerrar"
                href="../../lading-page/paginaprincipal.html"
                aria-label="Cerrar"
                title="Cerrar"
            >
                ✕
            </a>
        </header>

        <main class="AuthCentro">
            <section class="AuthCaja">
                <h1>Verifica tu correo</h1>
                <p class="AuthSubtitulo">Confirma tu identidad para activar tu cuenta</p>

                <h2>Código de verificación</h2>
                <form id="formVerificarEmail">
                    <div class="form-group">
                        <label for="correoVerificar">Correo electrónico</label>
                        <input
                            type="email"
                            id="correoVerificar"
                            name="correoVerificar"
                            placeholder="tugmail@gmail.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="codigoVerificar">Código de verificación</label>
                        <input
                            type="text"
                            id="codigoVerificar"
                            name="codigoVerificar"
                            placeholder="6 dígitos"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            title="El código tiene 6 dígitos"
                            required
                        />
                    </div>

                    <div class="margen-arriba">
                        <button type="submit" class="btn btn-principal">Verificar correo</button>
                    </div>

                    <div class="margen-arriba">
                        <button type="button" id="botonReenviar" class="btn btn-secundario">
                            Reenviar código
                        </button>
                    </div>
                </form>

                <p id="mensajeVerificar" class="mensaje-perfil" role="status"></p>

                <p class="AuthEnlace">
                    ¿Ya verificaste tu correo?
                    <a href="login.html">Inicia sesión aquí.</a>
                </p>
            </section>
        </main>
        <script type="module" src="../dom/auth/verificaremail.js"></script>
    </body>
</html>
