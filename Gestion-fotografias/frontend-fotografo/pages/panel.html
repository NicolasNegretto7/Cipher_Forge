<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Colecciones</title>
    <link rel="stylesheet" href="../css/panel.css">
</head>
<body>

    
       <div class="Contenedor">

        
        <div class="Sidebar">

            <div class="Logo">
                <p>Galería del Fotógrafo ▾</p>
              
                 </div>

            <Div class="Menu">
                <div class="ItemMenuActivo">
                    <p>Colecciones</p>
                </div>

                <div class="ItemMenu">
                    <p>Biblioteca</p>
                </div>

                <div class="ItemMenu">
                    <p>Destacados</p>
                </div>

                <div class="ItemMenu">
                    <p>Subir Imagen</p>
                </div>

                
                 </Div>
 
            <hr>

            

            <div class="Almacenamiento">
                <div class="CirculoAlmacenamiento"></div>
                <p>0 GB de 3 GB usados</p>
                <div class="BotonMas">+</div>
            </div>

        </div>

        
        <div class="Principal">

            <div class="Encabezado">
                <h1>Colecciones</h1>

                <input type="text" placeholder=" Buscar" class="Buscador">

                <a href="#" class="VerPreajustes">Ver preajustes</a>

                <button class="BotonNuevaColeccion">Nueva colección</button>
            </div>

           

    </div>

    

    
    

</body>
</html>
