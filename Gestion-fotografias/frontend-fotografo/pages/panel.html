<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Colecciones</title>
    <link rel="stylesheet" href="../css/panel.css">
</head>
<body>

    
       <div class="Contenedor">

        
        <div class="Sidebar">

            <div class="Logo">
                <p>Galería del Fotógrafo ▾</p>
              
                 </div>

            <Div class="Menu">
                <a class="ItemMenuActivo" href="panel.html">
                    <p>Colecciones Publicas</p>
                </a>

                <a class="ItemMenu" href="tuscolecciones.html">
                    <p>Tus Colecciones</p>
                </a>

                <a class="ItemMenu" href="favoritos.html">
                    <p>Favoritos</p>
                </a>

                
                 </Div>
 
            <hr>

            

            <div class="Almacenamiento">
                <div class="CirculoAlmacenamiento"></div>
                <p>0 GB de 3 GB usados</p>
                <div class="BotonMas">+</div>
            </div>

        </div>

        
        <div class="Principal">

            <div class="Encabezado">
                <h1>Colecciones Publicas</h1>
                <div class="ZonaBuscadorTags">
                    <input id="tagBusqueda" type="text" placeholder="Escribe un tag y presiona Enter">
                    <div class="BuscadorTags" id="buscadorTags">
                        <div class="ListaTags" id="tagsBusqueda"></div>
                        <p id="contadorTags">0 tags seleccionados</p>
                    </div>
                </div>
            </div>

            <div class="GaleriaColecciones" id="galeriaPublica"></div>
                <div class="DetalleColeccion" id="detalleColeccion">
                    <button class="CerrarDetalle" id="cerrarColeccion" type="button">&#10005;</button>
                    <button class="FlechaColeccion Izquierda" id="imagenAnterior" type="button">&#10094;</button>
                    <div class="ImagenColeccionGrande" id="imagenColeccionGrande"></div>
                    <button class="FlechaColeccion Derecha" id="imagenSiguiente" type="button">&#10095;</button>
                    <div class="InfoColeccion" id="infoColeccion"></div>
                </div>

    </div>

    

    
    

    <script src="../js/panel.js"></script>
</body>
</html>
