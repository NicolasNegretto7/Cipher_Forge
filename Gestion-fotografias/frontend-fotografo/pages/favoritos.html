<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Colecciones</title>
    <link rel="stylesheet" href="../css/panel.css">
</head>
<body>

    
       <div class="Contenedor">

        
        <div class="Sidebar">

            <div class="Logo">
                <p>Galería del Fotógrafo ▾</p>
              
                 </div>

            <Div class="Menu">
                <a class="ItemMenu" href="panel.html">
                    <p>Colecciones Publicas</p>
                </a>

                <a class="ItemMenu" href="tuscolecciones.html">
                    <p>Tus Colecciones</p>
                </a>

                <a class="ItemMenuActivo" href="favoritos.html">
                    <p>Favoritos</p>
                </a>

                
                
                 </Div>
 
            <hr>

            

            <div class="Almacenamiento">
                <p class="TextoAlmacenamiento">0 KB de 3 GB usados</p>
                <div class="BotonMas">+</div>
            </div>

        </div>

        
        <div class="Principal">

            <div class="Encabezado">
                <h1>Favoritos</h1>
            </div>

            <div class="GaleriaColecciones" id="galeriaFavoritos">
                <div class="Sinfavoritos" id="sinFavoritos">
                    <p>No tienes favoritos aún.</p>
                </div>
            </div>

            <div class="DetalleColeccion" id="detalleColeccion">
              
                <button class="FlechaColeccion Izquierda" id="imagenAnterior" type="button">&#10094;</button>
                <div class="ImagenColeccionGrande" id="imagenColeccionGrande"></div>
                <button class="FlechaColeccion Derecha" id="imagenSiguiente" type="button">&#10095;</button>
                <div class="InfoColeccion" id="infoColeccion"></div>
            </div>
        </div>
            </div>

    <script src="../js/almacenamiento.js"></script>
    <script src="../js/favoritos.js"></script>
