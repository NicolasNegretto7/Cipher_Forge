<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cipher Photo para fotógrafos</title>
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/estilos.css" />
    </head>
    <body>
        <header>
            <h1>Iniciar sesión</h1>
            <p>Entra a tu espacio de trabajo como fotógrafo</p>
        </header>

        <main class="container">
            <section class="card">
                <h2>Completa tus datos</h2>
                <form id="formLogin">
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input
                            id="correo"
                            name="correo"
                            type="email"
                            placeholder="nombre@correo.com"
                            autocomplete="email"
                            title="Usa un correo válido"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="contraseña">Contraseña</label>
                        <input
                            id="contraseña"
                            name="contraseña"
                            type="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                            required
                        />
                    </div>

                    <div class="texto-centrado margen-arriba">
                        <button type="submit" class="btn btn-principal">Ingresar</button>
                    </div>
                </form>

                <p id="mensajeLogin" class="mensaje-perfil" role="status"></p>

                <p class="texto-centrado margen-arriba">
                    ¿Todavía no tienes cuenta?
                    <a id="enlaceRegistro" href="pages/registro.html">Crear cuenta</a>
                </p>
            </section>
        </main>

        <footer>
            <p>Políticas de Privacidad.</p>
        </footer>
        <script type="module" src="dom/auth/login.js"></script>
    </body>
</html>
